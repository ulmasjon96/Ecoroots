<!doctype html>
<html lang="uz">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>EcoRoots · Daraxtni masofadan eking</title>
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23173326'/%3E%3Cpath d='M16 25V14' stroke='%23EAF2E6' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M16 17c-4 0-6-3-6-7 4 0 6 3 6 7zM16 15c0-4 2.5-6.5 6.5-6.5 0 4-2.5 6.5-6.5 6.5z' fill='%2362B865'/%3E%3Cpath d='M11 25h10' stroke='%23D2A94F' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600&display=swap"
			rel="stylesheet" />
		<script>
			try {
				var th = JSON.parse(localStorage.getItem('ecoroots:theme'));
				if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
			} catch (e) {}
		</script>
		<style>
			/* =========================================================
			   Tokens. Colours are unchanged; everything else (space,
			   radius, type, control sizes) comes from the scales below.
			   ========================================================= */
			:root {
				--bg: #eef1ea;
				--surface: #ffffff;
				--surface2: #f6f8f3;
				--ink: #1c2b22;
				--muted: #5b6b60;
				--line: #d5dcd0;
				--juniper: #173326;
				--land: #27493b;
				--turq: #16807f;
				--turq-soft: #d6ecea;
				--leaf: #3f9a45;
				--leaf-soft: #ddefd9;
				--sand: #d2a94f;
				--sand-soft: #f4e8c9;
				--danger: #b5452f;
				--on-dark: #eaf2e6;
				--on-dark-muted: #b9cbbe;

				--display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
				--body: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

				/* spacing */
				--s1: 4px;
				--s2: 8px;
				--s3: 12px;
				--s4: 16px;
				--s5: 24px;
				--s6: 32px;
				--s7: 48px;
				--s8: 64px;

				/* radius */
				--r-sm: 8px; /* buttons, inputs, pills */
				--r-md: 14px; /* cards, panels, dialogs */
				--r-lg: 22px; /* hero, maps */

				/* type: six sizes + a clamp for the hero */
				--fs-xs: 12px;
				--fs-sm: 14px;
				--fs-md: 16px;
				--fs-lg: 18px;
				--fs-xl: 24px;
				--fs-2xl: 32px;
				--fs-hero: clamp(32px, 3.6vw, 48px); /* longest uz word must fit the 5/12 hero column */
				--fw-regular: 400;
				--fw-medium: 500;
				--fw-semibold: 600;

				/* layout & controls */
				--page-w: 1180px;
				--gutter: var(--s5);
				--header-h: 64px;
				--bnav-h: 64px;
				--ctl-h: 44px;
				--ctl-h-sm: 36px;
				--icon: 20px;
				--bw: 1px;
				--bw-ctl: 1.5px;
				--ease: 0.12s ease;

				box-sizing: border-box;
				padding-top: env(safe-area-inset-top, 0px);
				padding-bottom: env(safe-area-inset-bottom, 0px);
			}
			@media (prefers-color-scheme: dark) {
				:root:not([data-theme='light']) {
					--bg: #0f1712;
					--surface: #16211a;
					--surface2: #1b2820;
					--ink: #e4ebe1;
					--muted: #98a89c;
					--line: #2a3b30;
					--juniper: #0b1811;
					--land: #1e3b2f;
					--turq: #3fb3b0;
					--turq-soft: #16393a;
					--leaf: #62b865;
					--leaf-soft: #1d3520;
					--sand: #d9b25e;
					--sand-soft: #3a3120;
					--danger: #e0775f;
				}
			}
			:root[data-theme='dark'] {
				--bg: #0f1712;
				--surface: #16211a;
				--surface2: #1b2820;
				--ink: #e4ebe1;
				--muted: #98a89c;
				--line: #2a3b30;
				--juniper: #0b1811;
				--land: #1e3b2f;
				--turq: #3fb3b0;
				--turq-soft: #16393a;
				--leaf: #62b865;
				--leaf-soft: #1d3520;
				--sand: #d9b25e;
				--sand-soft: #3a3120;
				--danger: #e0775f;
			}
			@media (max-width: 600px) {
				:root {
					--gutter: var(--s4);
				}
			}

			/* =========================================================
			   Base
			   ========================================================= */
			html {
				scroll-padding-top: calc(var(--header-h) + var(--s4));
			}
			*,
			*::before,
			*::after {
				box-sizing: inherit;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--ink);
				font-family: var(--body);
				font-size: var(--fs-md);
				font-weight: var(--fw-regular);
				line-height: 1.5;
				-webkit-font-smoothing: antialiased;
			}
			img,
			svg {
				max-width: 100%;
			}
			a {
				color: var(--turq);
				text-underline-offset: 2px;
			}
			a:hover {
				text-decoration-thickness: 2px;
			}
			b,
			strong {
				font-weight: var(--fw-semibold);
			}
			button,
			input,
			select,
			textarea {
				font: inherit;
				color: inherit;
			}
			button {
				cursor: pointer;
			}
			button:disabled {
				cursor: not-allowed;
			}
			:focus-visible {
				outline: 3px solid var(--turq);
				outline-offset: 2px;
			}
			h1,
			h2,
			h3 {
				font-family: var(--display);
				font-weight: var(--fw-semibold);
				line-height: 1.2;
				margin: 0;
				letter-spacing: -0.01em;
				overflow-wrap: break-word;
			}
			h1 {
				font-size: var(--fs-2xl);
			}
			h2 {
				font-size: var(--fs-xl);
			}
			h3 {
				font-size: var(--fs-lg);
			}
			@media (max-width: 600px) {
				h1 {
					font-size: var(--fs-xl);
				}
			}
			p {
				margin: 0;
			}

			/* text roles — one class per job */
			.muted {
				color: var(--muted);
			}
			.small {
				font-size: var(--fs-sm);
			}
			.subtle {
				/* secondary meta line: ids, dates, descriptions under titles */
				font-size: var(--fs-sm);
				color: var(--muted);
			}
			.caption {
				/* labels above values, photo captions */
				display: block;
				font-size: var(--fs-xs);
				color: var(--muted);
			}
			.kicker {
				/* small label above a page title */
				font-size: var(--fs-sm);
				color: var(--muted);
				margin-bottom: var(--s1);
			}
			.lead {
				color: var(--muted);
				max-width: 70ch;
			}
			.nowrap {
				white-space: nowrap;
			}
			.invisible {
				visibility: hidden;
			}
			.mt-2 {
				margin-top: var(--s2);
			}
			.mt-3 {
				margin-top: var(--s3);
			}
			.mt-4 {
				margin-top: var(--s4);
			}

			/* =========================================================
			   Page layout & headings rhythm
			   title → s2 → lead;  section title: s7 above, s4 below;
			   blocks stack with s5.
			   ========================================================= */
			.top-in,
			main {
				max-width: var(--page-w);
				margin: 0 auto;
				padding-left: var(--gutter);
				padding-right: var(--gutter);
			}
			main {
				padding-top: var(--s6);
				padding-bottom: var(--s8);
			}
			.page-head .lead {
				margin-top: var(--s2);
			}
			.page-head .title-meta {
				margin-top: var(--s3);
			}
			.section-title {
				margin: var(--s7) 0 var(--s4);
			}
			.section-head {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: var(--s4);
				flex-wrap: wrap;
				margin: var(--s7) 0 var(--s4);
			}

			/* =========================================================
			   Header
			   ========================================================= */
			.top {
				position: sticky;
				top: env(safe-area-inset-top, 0px);
				z-index: 20;
				background: color-mix(in srgb, var(--bg) 88%, transparent);
				backdrop-filter: blur(10px);
				border-bottom: var(--bw) solid var(--line);
			}
			.top-in {
				height: var(--header-h);
				display: flex;
				align-items: center;
				gap: var(--s5);
			}
			.brand {
				flex: none;
				display: flex;
				align-items: center;
				gap: var(--s2);
				text-decoration: none;
				color: var(--ink);
				font-family: var(--display);
				font-weight: var(--fw-semibold);
				font-size: var(--fs-lg);
			}
			.brand svg {
				width: 32px;
				height: 32px;
			}
			.nav {
				display: flex;
				align-items: center;
				gap: var(--s1);
				margin-left: auto;
				min-width: 0;
			}
			.nav a {
				display: inline-flex;
				align-items: center;
				height: var(--ctl-h-sm);
				padding: 0 var(--s3);
				border-radius: var(--r-sm);
				text-decoration: none;
				color: var(--muted);
				font-size: var(--fs-sm);
				font-weight: var(--fw-medium);
				white-space: nowrap;
				transition:
					color var(--ease),
					background var(--ease);
			}
			.nav a:hover {
				color: var(--ink);
				background: var(--surface2);
			}
			.nav a[aria-current='page'] {
				background: var(--juniper);
				color: var(--on-dark);
			}
			.nav .nav-short {
				display: none;
			}
			.top-tools {
				flex: none;
				display: flex;
				align-items: center;
				gap: var(--s2);
			}
			.lang-switch {
				display: flex;
				height: var(--ctl-h-sm);
				padding: var(--s1);
				gap: var(--s1);
				border: var(--bw-ctl) solid var(--line);
				border-radius: var(--r-sm);
			}
			.lang-switch button {
				border: 0;
				background: transparent;
				color: var(--muted);
				font-size: var(--fs-xs);
				font-weight: var(--fw-semibold);
				padding: 0 var(--s2);
				border-radius: var(--r-sm);
				line-height: 1;
				transition:
					color var(--ease),
					background var(--ease);
			}
			.lang-switch button:hover {
				color: var(--ink);
				background: var(--surface2);
			}
			.lang-switch button[aria-pressed='true'] {
				background: var(--ink);
				color: var(--bg);
			}
			.theme-btn {
				width: var(--ctl-h-sm);
				height: var(--ctl-h-sm);
				display: inline-flex;
				align-items: center;
				justify-content: center;
				padding: 0;
				border: var(--bw-ctl) solid var(--line);
				border-radius: var(--r-sm);
				background: transparent;
				color: var(--ink);
				transition: border-color var(--ease);
			}
			.theme-btn:hover {
				border-color: var(--turq);
			}
			.theme-btn svg {
				width: var(--icon);
				height: var(--icon);
			}
			.demo-tag {
				font-size: var(--fs-xs);
				color: var(--muted);
				border: var(--bw) dashed var(--line);
				padding: var(--s1) var(--s2);
				border-radius: var(--r-sm);
				white-space: nowrap;
			}
			@media (max-width: 1023px) {
				.demo-tag {
					display: none;
				}
			}
			@media (max-width: 1023px) {
				.top-in {
					gap: var(--s4);
				}
				.nav {
					gap: 0;
				}
				.nav a {
					padding: 0 var(--s2);
				}
			}
			@media (max-width: 1179px) {
				.nav .nav-full {
					display: none;
				}
				.nav .nav-short {
					display: inline;
				}
			}
			.bottom-nav {
				display: none;
			}
			@media (max-width: 860px) {
				.nav {
					display: none;
				}
				.top-tools {
					margin-left: auto;
				}
				.bottom-nav {
					display: flex;
					position: fixed;
					left: 0;
					right: 0;
					bottom: 0;
					z-index: 30;
					height: calc(var(--bnav-h) + env(safe-area-inset-bottom, 0px));
					padding: 0 var(--s1) env(safe-area-inset-bottom, 0px);
					background: var(--surface);
					border-top: var(--bw) solid var(--line);
				}
				.bottom-nav a {
					flex: 1 1 0;
					min-width: 0;
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					gap: var(--s1);
					font-size: var(--fs-xs);
					color: var(--muted);
					text-decoration: none;
					transition: color var(--ease);
				}
				.bottom-nav a span {
					max-width: 100%;
					overflow: hidden;
					text-overflow: ellipsis;
					white-space: nowrap;
				}
				.bottom-nav a:hover {
					color: var(--ink);
				}
				.bottom-nav a svg {
					width: var(--icon);
					height: var(--icon);
				}
				.bottom-nav a[aria-current='page'] {
					color: var(--turq);
					font-weight: var(--fw-semibold);
				}
				main {
					padding-bottom: calc(var(--bnav-h) + var(--s6) + env(safe-area-inset-bottom, 0px));
				}
			}

			/* =========================================================
			   Controls: buttons, inputs, chips
			   ========================================================= */
			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: var(--s2);
				min-height: var(--ctl-h);
				padding: var(--s2) var(--s5);
				border: var(--bw-ctl) solid transparent;
				border-radius: var(--r-sm);
				font-size: var(--fs-md);
				font-weight: var(--fw-semibold);
				line-height: 1.25;
				text-align: center;
				text-decoration: none;
				cursor: pointer;
				transition:
					filter var(--ease),
					border-color var(--ease),
					background var(--ease),
					transform var(--ease);
			}
			.btn:active:not(:disabled) {
				transform: scale(0.98);
			}
			.btn:disabled,
			.btn[disabled] {
				opacity: 0.45;
				cursor: not-allowed;
			}
			.btn-primary {
				background: var(--turq);
				color: #fff;
			}
			.btn-leaf {
				background: var(--leaf);
				color: #fff;
			}
			.btn-primary:hover:not(:disabled),
			.btn-leaf:hover:not(:disabled) {
				filter: brightness(1.08);
			}
			.btn-ghost {
				background: transparent;
				border-color: var(--line);
				color: var(--ink);
			}
			.btn-ghost:hover:not(:disabled) {
				border-color: var(--turq);
			}
			.btn-sm {
				min-height: var(--ctl-h-sm);
				padding: var(--s1) var(--s4);
				font-size: var(--fs-sm);
			}
			.btn-icon {
				width: var(--ctl-h-sm);
				padding: 0;
			}
			.btn-block {
				width: 100%;
			}
			.btn-stack {
				display: flex;
				flex-direction: column;
				gap: var(--s2);
				margin-top: var(--s3);
			}

			.field {
				display: flex;
				flex-direction: column;
				gap: var(--s2);
				margin-top: var(--s4);
			}
			.field label {
				font-size: var(--fs-sm);
				font-weight: var(--fw-medium);
			}
			.field input,
			.field select,
			.field textarea {
				width: 100%;
				min-height: var(--ctl-h);
				padding: 0 var(--s3);
				background: var(--surface);
				border: var(--bw-ctl) solid var(--line);
				border-radius: var(--r-sm);
				transition: border-color var(--ease);
			}
			.field textarea {
				padding: var(--s3);
				resize: vertical;
			}
			.field input:hover,
			.field select:hover,
			.field textarea:hover {
				border-color: color-mix(in srgb, var(--turq) 50%, var(--line));
			}
			.field input:focus,
			.field select:focus,
			.field textarea:focus {
				border-color: var(--turq);
			}
			.field input:disabled,
			.field select:disabled,
			.field textarea:disabled {
				opacity: 0.45;
				cursor: not-allowed;
			}

			.pill {
				display: inline-flex;
				align-items: center;
				gap: var(--s2);
				padding: var(--s1) var(--s2);
				border-radius: var(--r-sm);
				font-size: var(--fs-xs);
				font-weight: var(--fw-medium);
				line-height: 16px;
				white-space: nowrap;
			}
			.pill.alive {
				background: var(--leaf-soft);
				color: var(--leaf);
			}
			.pill.check {
				background: var(--sand-soft);
				color: color-mix(in srgb, var(--sand) 70%, var(--ink));
			}
			.pill.pending {
				background: var(--turq-soft);
				color: var(--turq);
			}
			.pill.dead {
				background: color-mix(in srgb, var(--danger) 15%, transparent);
				color: var(--danger);
			}
			.dot {
				flex: none;
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: currentColor;
			}

			/* =========================================================
			   Surfaces
			   ========================================================= */
			.panel {
				background: var(--surface);
				border: var(--bw) solid var(--line);
				border-radius: var(--r-md);
				padding: var(--s5);
			}
			.panel-sub {
				margin-top: var(--s5);
			}
			.panel-desc {
				margin: var(--s1) 0 var(--s3);
			}
			.note {
				font-size: var(--fs-sm);
				color: var(--muted);
				border-left: 3px solid var(--sand);
				padding: var(--s2) var(--s3);
				margin-top: var(--s5);
				background: var(--surface2);
				border-radius: 0 var(--r-sm) var(--r-sm) 0;
			}
			.empty {
				margin-top: var(--s5);
				padding: var(--s7) var(--s5);
				text-align: center;
				border: var(--bw-ctl) dashed var(--line);
				border-radius: var(--r-md);
			}
			.empty p {
				margin: var(--s2) auto 0;
				max-width: 44ch;
				color: var(--muted);
			}
			.empty .btn {
				margin-top: var(--s5);
			}
			.kpis {
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: var(--s4);
				margin-top: var(--s5);
			}
			.kpis .panel b {
				display: block;
				font-family: var(--display);
				font-size: var(--fs-xl);
				font-weight: var(--fw-semibold);
				line-height: 1.2;
				margin-bottom: var(--s1);
				font-variant-numeric: tabular-nums;
				overflow-wrap: anywhere;
			}
			@media (max-width: 600px) {
				.kpis {
					grid-template-columns: 1fr;
				}
			}

			/* =========================================================
			   Home
			   ========================================================= */
			.hero {
				display: grid;
				grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
				background: var(--juniper);
				border-radius: var(--r-lg);
				overflow: hidden;
				color: var(--on-dark);
				min-height: 480px;
			}
			.hero-copy {
				padding: var(--s7) var(--s6);
				display: flex;
				flex-direction: column;
				justify-content: center;
				gap: var(--s5);
			}
			.hero-copy h1 {
				color: #f2f7ef;
				font-size: var(--fs-hero);
				line-height: 1.1;
			}
			.hero-copy p {
				color: var(--on-dark-muted);
				max-width: 44ch;
				font-size: var(--fs-lg);
			}
			.hero-actions {
				display: flex;
				gap: var(--s3);
				flex-wrap: wrap;
			}
			.hero .btn-ghost {
				color: var(--on-dark);
				border-color: #3b5c4c;
			}
			.hero .btn-ghost:hover {
				border-color: var(--on-dark);
			}
			.hero-map {
				position: relative;
				min-height: 360px;
			}
			.map-canvas {
				position: absolute;
				inset: 0;
			}
			.map-error {
				height: 100%;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: var(--s2);
				padding: var(--s5);
				text-align: center;
				font-size: var(--fs-sm);
				color: var(--on-dark);
			}
			.map-error p {
				max-width: 44ch;
				color: var(--on-dark-muted);
			}
			.hero-legend {
				position: absolute;
				left: var(--s4);
				bottom: var(--s4);
				display: flex;
				flex-wrap: wrap;
				gap: var(--s4);
				font-size: var(--fs-xs);
				color: var(--on-dark-muted);
			}
			.lg {
				display: inline-flex;
				align-items: center;
				gap: var(--s2);
			}
			.lg i {
				width: 8px;
				height: 8px;
				border-radius: 50%;
			}
			.lg-tree {
				background: #7ed281;
			}
			.lg-risk {
				background: #d9b25e;
			}
			@media (max-width: 860px) {
				.hero {
					grid-template-columns: 1fr;
					min-height: 0;
				}
				.hero-copy {
					padding: var(--s6) var(--s5);
				}
				.hero-map {
					min-height: 280px;
				}
			}
			@media (max-width: 600px) {
				.hero-copy {
					padding: var(--s5) var(--s4);
				}
			}
			.stats {
				display: grid;
				grid-template-columns: repeat(4, minmax(0, 1fr));
				gap: var(--bw);
				margin-top: var(--s5);
				background: var(--line);
				border: var(--bw) solid var(--line);
				border-radius: var(--r-md);
				overflow: hidden;
			}
			.stat {
				background: var(--surface);
				padding: var(--s4) var(--s5);
			}
			.stat b {
				display: block;
				font-family: var(--display);
				font-size: var(--fs-xl);
				font-weight: var(--fw-semibold);
				line-height: 1.2;
				margin-bottom: var(--s1);
				font-variant-numeric: tabular-nums;
			}
			.stat span {
				font-size: var(--fs-sm);
				color: var(--muted);
			}
			@media (max-width: 700px) {
				.stats {
					grid-template-columns: repeat(2, minmax(0, 1fr));
				}
			}
			@media (max-width: 600px) {
				.stat {
					padding: var(--s4);
				}
			}
			.steps {
				display: grid;
				grid-template-columns: repeat(4, minmax(0, 1fr));
				gap: var(--s5);
				counter-reset: s;
			}
			.step {
				border-top: 3px solid var(--turq);
				padding-top: var(--s4);
			}
			.step::before {
				counter-increment: s;
				content: counter(s);
				display: block;
				margin-bottom: var(--s2);
				font-family: var(--display);
				font-size: var(--fs-xl);
				line-height: 1.2;
				color: var(--turq);
			}
			.step p {
				color: var(--muted);
				margin-top: var(--s2);
			}
			@media (max-width: 860px) {
				.steps {
					grid-template-columns: repeat(2, minmax(0, 1fr));
				}
			}
			@media (max-width: 520px) {
				.steps {
					grid-template-columns: 1fr;
				}
			}
			.split {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: var(--s4);
			}
			@media (max-width: 760px) {
				.split {
					grid-template-columns: 1fr;
				}
			}
			.use-card {
				display: flex;
				flex-direction: column;
				gap: var(--s2);
				padding: var(--s5);
				border-radius: var(--r-md);
				background: var(--surface);
				border: var(--bw) solid var(--line);
			}

			/* =========================================================
			   Map page
			   ========================================================= */
			.map-layout {
				display: grid;
				grid-template-columns: 320px minmax(0, 1fr);
				gap: var(--s4);
				margin-top: var(--s5);
				align-items: start;
			}
			@media (max-width: 900px) {
				.map-layout {
					grid-template-columns: 1fr;
				}
			}
			.map-box {
				position: relative;
				min-height: 520px;
				background: var(--juniper);
				border-radius: var(--r-lg);
				overflow: hidden;
			}
			@media (max-width: 600px) {
				.map-box {
					min-height: 440px;
				}
			}
			.map-box svg {
				display: block;
				width: 100%;
				height: 100%;
				cursor: grab;
			}
			.map-tools {
				position: absolute;
				right: var(--s3);
				top: var(--s3);
				display: flex;
				flex-direction: column;
				gap: var(--s2);
			}
			.map-tools button {
				width: var(--ctl-h);
				height: var(--ctl-h);
				border-radius: var(--r-sm);
				border: var(--bw) solid #3b5c4c;
				background: #173326;
				color: var(--on-dark);
				font-size: var(--fs-lg);
				transition: border-color var(--ease);
			}
			.map-tools button:hover {
				border-color: var(--on-dark);
			}
			.map-hint {
				position: absolute;
				left: var(--s3);
				top: var(--s3);
				right: calc(var(--ctl-h) + var(--s5));
				width: fit-content;
				font-size: var(--fs-xs);
				color: #9fb6a6;
				background: rgba(10, 24, 16, 0.6);
				padding: var(--s1) var(--s2);
				border-radius: var(--r-sm);
			}
			.filters h3 {
				margin-bottom: var(--s2);
			}
			.filters h3:not(:first-child) {
				margin-top: var(--s5);
			}
			.filters label {
				display: flex;
				align-items: center;
				gap: var(--s3);
				padding: var(--s2) 0;
				cursor: pointer;
			}
			.filters input {
				flex: none;
				width: var(--icon);
				height: var(--icon);
				margin: 0;
				accent-color: var(--turq);
			}
			.tree-pop {
				position: absolute;
				left: var(--s3);
				right: var(--s3);
				bottom: var(--s3);
				max-width: 360px;
				display: none;
				padding: var(--s4);
				background: var(--surface);
				color: var(--ink);
				border-radius: var(--r-md);
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
			}
			.tree-pop.show {
				display: block;
			}
			.pop-head {
				display: flex;
				justify-content: space-between;
				align-items: flex-start;
				gap: var(--s2);
			}
			.pop-meta {
				margin: var(--s2) 0;
			}
			.pop-actions {
				margin-top: var(--s3);
			}
			.region-list {
				display: flex;
				flex-direction: column;
				gap: var(--s2);
			}
			.region-list button {
				display: flex;
				flex-direction: column;
				gap: var(--s1);
				text-align: left;
				padding: var(--s2) var(--s3);
				background: var(--surface2);
				border: var(--bw) solid var(--line);
				border-radius: var(--r-sm);
				transition: border-color var(--ease);
			}
			.region-list button br {
				display: none;
			}
			.region-list button:hover {
				border-color: var(--turq);
			}

			/* =========================================================
			   Plant wizard
			   ========================================================= */
			.progress {
				display: flex;
				gap: var(--s2);
				margin-top: var(--s4);
			}
			.progress div {
				flex: 1;
				height: var(--s1);
				border-radius: var(--r-sm);
				background: var(--line);
			}
			.progress div.on {
				background: var(--turq);
			}
			.step-count {
				margin-top: var(--s2);
			}
			.wizard {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 320px;
				gap: var(--s5);
				margin-top: var(--s5);
				align-items: start;
			}
			@media (max-width: 900px) {
				.wizard {
					grid-template-columns: 1fr;
				}
			}
			.wizard .lead {
				margin-top: var(--s2);
			}
			.choices {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
				gap: var(--s4);
				margin-top: var(--s5);
			}
			@media (max-width: 600px) {
				.choices {
					grid-template-columns: 1fr;
				}
			}
			.choice {
				position: relative;
				display: flex;
				flex-direction: column;
				gap: var(--s2);
				height: 100%;
				padding: var(--s4);
				text-align: left;
				background: var(--surface);
				border: var(--bw-ctl) solid var(--line);
				border-radius: var(--r-md);
				transition:
					border-color var(--ease),
					box-shadow var(--ease);
			}
			.choice > :last-child {
				/* price / partner / description sits on the card's bottom edge */
				margin-top: auto;
			}
			.choice:hover:not(:disabled) {
				border-color: color-mix(in srgb, var(--turq) 60%, var(--line));
			}
			.choice[aria-pressed='true'] {
				border-color: var(--turq);
				box-shadow: 0 0 0 3px var(--turq-soft);
			}
			.choice:disabled {
				opacity: 0.45;
			}
			.choice-foot {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				gap: var(--s2);
				padding-top: var(--s2);
				font-size: var(--fs-sm);
				color: var(--muted);
			}
			.price {
				color: var(--ink);
				font-weight: var(--fw-semibold);
				white-space: nowrap;
			}
			.choice .latin {
				font-style: italic;
				font-size: var(--fs-sm);
				color: var(--muted);
			}
			.risk {
				align-self: flex-start;
				padding: var(--s1) var(--s2);
				border-radius: var(--r-sm);
				font-size: var(--fs-xs);
				font-weight: var(--fw-medium);
				line-height: 16px;
				background: var(--sand-soft);
				color: color-mix(in srgb, var(--sand) 65%, var(--ink));
			}
			.pay-head {
				display: flex;
				align-items: center;
				gap: var(--s3);
			}
			.pay-mark {
				flex: none;
				width: var(--s6);
				height: var(--s6);
			}
			.counter {
				display: flex;
				align-items: center;
				gap: var(--s3);
			}
			.counter button {
				width: var(--ctl-h);
				height: var(--ctl-h);
				border-radius: var(--r-sm);
				border: var(--bw-ctl) solid var(--line);
				background: var(--surface);
				font-size: var(--fs-xl);
				line-height: 1;
				transition: border-color var(--ease);
			}
			.counter button:hover {
				border-color: var(--turq);
			}
			.counter output {
				min-width: 3ch;
				text-align: center;
				font-family: var(--display);
				font-size: var(--fs-xl);
				font-variant-numeric: tabular-nums;
			}
			.presets {
				display: flex;
				flex-wrap: wrap;
				gap: var(--s2);
				margin-top: var(--s3);
			}
			.presets button {
				height: var(--ctl-h-sm);
				padding: 0 var(--s4);
				border: var(--bw-ctl) solid var(--line);
				border-radius: var(--r-sm);
				background: var(--surface);
				font-size: var(--fs-sm);
				transition: border-color var(--ease);
			}
			.presets button:hover {
				border-color: var(--turq);
			}
			.summary {
				position: sticky;
				top: calc(var(--header-h) + var(--s4));
			}
			.summary dl {
				display: grid;
				grid-template-columns: auto minmax(0, 1fr);
				gap: var(--s2) var(--s3);
				margin: var(--s4) 0;
			}
			.summary dt {
				font-size: var(--fs-sm);
				color: var(--muted);
			}
			.summary dd {
				margin: 0;
				text-align: right;
				font-weight: var(--fw-medium);
				overflow-wrap: break-word;
			}
			.total {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				gap: var(--s3);
				padding-top: var(--s4);
				border-top: var(--bw) dashed var(--line);
			}
			.total b {
				font-family: var(--display);
				font-size: var(--fs-xl);
				font-variant-numeric: tabular-nums;
				white-space: nowrap;
			}
			.wiz-nav {
				display: flex;
				flex-wrap: wrap;
				justify-content: space-between;
				gap: var(--s3);
				margin-top: var(--s5);
			}
			@media (max-width: 600px) {
				/* buttons grow to full rows instead of breaking their labels */
				.wiz-nav .btn {
					flex: 1 1 auto;
				}
				.wiz-nav .invisible {
					display: none;
				}
			}
			.lbl-short {
				display: none;
			}
			@media (max-width: 480px) {
				.lbl-full {
					display: none;
				}
				.lbl-short {
					display: inline;
				}
			}
			.wiz-in-fwd {
				animation: wizInF 0.26s ease-out;
			}
			.wiz-in-back {
				animation: wizInB 0.26s ease-out;
			}
			.wiz-out-fwd,
			.wiz-out-back {
				opacity: 0;
				transition:
					opacity 0.14s ease-in,
					transform 0.14s ease-in;
			}
			.wiz-out-fwd {
				transform: translateX(calc(-1 * var(--s3)));
			}
			.wiz-out-back {
				transform: translateX(var(--s3));
			}
			@keyframes wizInF {
				from {
					opacity: 0;
					transform: translateX(var(--s4));
				}
				to {
					opacity: 1;
					transform: none;
				}
			}
			@keyframes wizInB {
				from {
					opacity: 0;
					transform: translateX(calc(-1 * var(--s4)));
				}
				to {
					opacity: 1;
					transform: none;
				}
			}

			/* =========================================================
			   Passport
			   ========================================================= */
			.back {
				display: inline-flex;
				align-items: center;
				gap: var(--s2);
				margin-bottom: var(--s3);
				font-size: var(--fs-sm);
				color: var(--muted);
				text-decoration: none;
			}
			.back:hover {
				color: var(--ink);
			}
			.passport {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 320px;
				gap: var(--s5);
				align-items: start;
			}
			@media (max-width: 900px) {
				.passport {
					grid-template-columns: 1fr;
				}
			}
			.dedication {
				margin: var(--s4) 0 0;
				padding: var(--s4) var(--s5);
				background: var(--turq-soft);
				border-radius: var(--r-md);
				font-size: var(--fs-lg);
			}
			.facts {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: var(--bw);
				margin-top: var(--s5);
				background: var(--line);
				border: var(--bw) solid var(--line);
				border-radius: var(--r-md);
				overflow: hidden;
			}
			.facts div {
				background: var(--surface);
				padding: var(--s3) var(--s4);
				overflow-wrap: break-word;
				min-width: 0;
			}
			.facts span {
				display: block;
				font-size: var(--fs-xs);
				color: var(--muted);
			}
			@media (max-width: 420px) {
				.facts {
					grid-template-columns: 1fr;
				}
			}
			.timeline {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
				gap: var(--s4);
			}
			.shot {
				margin: 0;
				border-radius: var(--r-md);
				overflow: hidden;
				background: var(--surface2);
				border: var(--bw) solid var(--line);
			}
			.shot .ph {
				display: block;
				width: 100%;
				aspect-ratio: 4/3;
				object-fit: cover;
				background: #cfd8c7;
			}
			.shot p {
				padding: var(--s2) var(--s3);
				font-size: var(--fs-xs);
				color: var(--muted);
			}
			.checks {
				display: flex;
				flex-direction: column;
				gap: var(--s2);
			}
			.checks > div {
				display: flex;
				align-items: center;
				gap: var(--s3);
				padding: var(--s3);
				border-radius: var(--r-sm);
				background: var(--surface2);
			}
			.checks svg {
				flex: none;
				width: var(--icon);
				height: var(--icon);
			}
			.mini-map {
				height: 200px;
				margin-top: var(--s5);
				border-radius: var(--r-md);
				overflow: hidden;
				background: var(--juniper);
			}
			.qr-card .qr {
				width: fit-content;
				margin: var(--s4) auto;
				padding: var(--s3);
				background: #fff;
				border-radius: var(--r-md);
			}
			.qr-card .qr svg {
				display: block;
				width: 200px;
				height: 200px;
			}
			.qr-card h3 + p {
				margin-top: var(--s1);
			}
			.hash {
				padding: var(--s3);
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: var(--fs-xs);
				word-break: break-all;
				text-align: left;
				background: var(--surface2);
				border: var(--bw) solid var(--line);
				border-radius: var(--r-sm);
			}

			/* =========================================================
			   Lists & tables
			   ========================================================= */
			.tabs {
				display: flex;
				flex-wrap: wrap;
				gap: var(--s2);
				margin-top: var(--s5);
			}
			.tabs button {
				height: var(--ctl-h-sm);
				padding: 0 var(--s4);
				border: var(--bw-ctl) solid var(--line);
				border-radius: var(--r-sm);
				background: var(--surface);
				font-size: var(--fs-sm);
				font-weight: var(--fw-medium);
				transition:
					border-color var(--ease),
					background var(--ease);
			}
			.tabs button:hover {
				border-color: var(--turq);
			}
			.tabs button[aria-selected='true'] {
				background: var(--juniper);
				border-color: var(--juniper);
				color: var(--on-dark);
			}
			.table-wrap {
				margin-top: var(--s5);
				overflow-x: auto;
				background: var(--surface);
				border: var(--bw) solid var(--line);
				border-radius: var(--r-md);
			}
			.tabs + .table-wrap {
				margin-top: var(--s4);
			}
			table {
				width: 100%;
				min-width: 560px;
				border-collapse: collapse;
				font-variant-numeric: tabular-nums;
			}
			th,
			td {
				padding: var(--s3) var(--s4);
				text-align: left;
				vertical-align: middle;
				border-bottom: var(--bw) solid var(--line);
			}
			th {
				font-size: var(--fs-xs);
				font-weight: var(--fw-medium);
				color: var(--muted);
				white-space: nowrap;
			}
			tr:last-child td {
				border-bottom: 0;
			}
			td.num,
			th.num {
				text-align: right;
			}
			.rank {
				width: var(--s7);
				font-family: var(--display);
				font-weight: var(--fw-semibold);
				color: var(--muted);
			}
			tr.top1 .rank {
				color: var(--sand);
			}
			.rate-cell {
				display: flex;
				align-items: center;
				gap: var(--s3);
			}
			.rate-cell .bar {
				flex: 1;
			}
			.rate-cell span {
				min-width: 4ch;
				text-align: right;
			}
			.bar {
				min-width: 80px;
				height: var(--s2);
				border-radius: var(--r-sm);
				background: var(--line);
				overflow: hidden;
			}
			.bar i {
				display: block;
				height: 100%;
				background: var(--leaf);
			}
			.order-list {
				display: flex;
				flex-direction: column;
				gap: var(--s3);
				margin-top: var(--s5);
			}
			.order,
			.review {
				display: grid;

					text-align: left;

					padding: var(--s4);
				}

				max-height: calc(100dvh - 2 * var(--s4));
				padding: 0;
				border: 0;
				border-radius: var(--r-md);
				background: var(--surface);
				color: var(--ink);

				max-width: 820px;

				background: rgba(8, 18, 12, 0.55);

				padding: var(--s5);

				display: flex;
				flex-wrap: wrap;
				justify-content: flex-end;

				margin-top: var(--s5);

				background: var(--surface2);
				font-size: var(--fs-sm);

			.gps svg {
				flex: none;
				width: var(--icon);
				height: var(--icon);

				display: block;
				margin-top: var(--s3);
				padding: var(--s5);
				text-align: center;

				border-radius: var(--r-md);

				transition: border-color var(--ease);

				border-color: var(--turq);

				margin-top: var(--s2);

				flex: none;
				width: var(--icon);
				height: var(--icon);

				padding: var(--s3) var(--s4);

			.cert-owner {
				margin-top: var(--s4);

			.cert-facts {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: var(--s3) var(--s5);
				margin: var(--s5) 0 0;
			}
			.cert-facts div {
				padding-top: var(--s2);
				border-top: var(--bw) solid var(--line);
				min-width: 0;
			}
			.cert-facts dt {
				font-size: var(--fs-xs);
				color: var(--muted);
			}
			.cert-facts dd {
				margin: 0;
				font-weight: var(--fw-medium);
				overflow-wrap: break-word;
			}
			.cert-foot {
				display: grid;
				grid-template-columns: 120px minmax(0, 1fr);

					margin: 12mm;
				}

				body > *:not(#printArea) {

				}

				}

				}

			.page-head + * {
				margin-top: var(--s5);
			}
			.section-title + *,
			.section-head + * {
				margin-top: 0;
			}
			td.nowrap {
				white-space: nowrap;
			}

			@media (prefers-reduced-motion: reduce) {
				* {
					transition: none !important;
					animation: none !important;
				}
			}

				const t = $('#toast');

				clearTimeout(t._h);

			function mulberry32(a) {
				return function () {
					a |= 0;
					a = (a + 0x6d2b79f5) | 0;
					let t = Math.imul(a ^ (a >>> 15), 1 | a);
					t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
					return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
				};
			}
			async function sha256(str) {
				const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
				return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');

				return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();

			function countUp(root) {
				const items = [...root.querySelectorAll('[data-count]')].map(el => ({

					to: +el.dataset.count,
					dec: +(el.dataset.dec || 0),
					pre: el.dataset.pre || '',
					suf: el.dataset.suf || '',

				const paint = k =>
					items.forEach(i => {
						i.el.textContent = i.pre + numFmt(i.dec ? i.to * k : Math.round(i.to * k), i.dec) + i.suf;
					});
				if (!items.length || !ANIM || reducedMotion()) {
					paint(1);
					return;
				}
				const t0 = performance.now(),
					D = 800;
				const frame = now => {
					if (!items[0].el.isConnected) return;
					const p = Math.min(1, (now - t0) / D);
					paint(1 - Math.pow(1 - p, 3));
					if (p < 1) requestAnimationFrame(frame);
				};
				paint(0);
				requestAnimationFrame(frame);

				const t = { ...seed, status: 'needs_review', dedication: null, mine: false };
				const ev = EVENTS.filter(e => e.tree === seed.id).at(-1);
				if (ev) {
					t.status = ev.to;
					t.reviewed = ev;
				}
				return t;
			}
			let REVIEW = REVIEW_SEED.map(reviewTree);
			TREES = TREES.concat(REVIEW.filter(t => t.status === 'alive'));

			function speciesOf(id) {
				return SPECIES.find(s => s.id === id);
			}
			function regionOf(id) {
				return REGIONS.find(r => r.id === id);
			}
			const STATUS_TEXT = {
				alive: 'Tirik · tasdiqlangan',
				check: 'Tekshiruvda',
				replanted: 'Qayta ekildi',
				planted: 'Ekildi · AI tekshiruvi kutilmoqda',
				needs_review: 'Qoʻlda tekshiruvda',
				rejected: 'Rad etildi',
			};
			const STATUS_CLASS = {
				alive: 'alive',
				check: 'check',
				replanted: 'pending',
				planted: 'check',
				needs_review: 'check',
				rejected: 'dead',
			};
			function statusPill(s) {
				return STATUS_TEXT[s]
					? `<span class="pill ${STATUS_CLASS[s]}"><span class="dot"></span>${STATUS_TEXT[s]}</span>`
					: '';
			}
			function openModal(html, { wide = false } = {}) {
				const dlg = $('#dlg');
				$('#dlgIn').innerHTML = html;
				dlg.classList.toggle('wide', wide);
				dlg.querySelectorAll('[data-close]').forEach(b => (b.onclick = () => dlg.close()));
				if (!dlg.open) dlg.showModal();
				return dlg;
			}
			function download(name, text, type) {
				const a = document.createElement('a');
				a.href = URL.createObjectURL(new Blob([text], { type }));
				a.download = name;
				document.body.append(a);
				a.click();
				a.remove();
				setTimeout(() => URL.revokeObjectURL(a.href), 1000);
			}
			function orderPill(s) {
				return (
					{
						paid: '<span class="pill pending"><span class="dot"></span>Hamkorga yuborildi</span>',
						planted: '<span class="pill alive"><span class="dot"></span>Ekildi</span>',
					}[s] || ''
				);
			}

			/* ========== map ========== */
			function drawMap(
				el,
				{
					interactive = false,
					onTree = null,
					onSoon = null,
					focus = null,
					highlight = null,
					filters = null,
					intro = false,
				} = {},
			) {
				el.innerHTML = '';
				if (!WORLD) {
					// geometry failed to load (e.g. opened via file://): explain instead of a blank box
					el.innerHTML = `<div class="map-error" role="alert"><b>${tr('map.error.title')}</b><p>${tr('map.error.body')}</p></div>`;
					const noop = () => {};
					return { focus: noop, zoomBy: noop, reset: noop };
				}
				const W = el.clientWidth || 800,
					H = el.clientHeight || 460;
				const svg = d3
					.select(el)
					.append('svg')
					.attr('viewBox', `0 0 ${W} ${H}`)
					.attr('role', 'img')
					.attr('aria-label', tr('map.aria'));
				const proj = d3.geoNaturalEarth1().fitExtent(
					[
						[8, 8],
						[W - 8, H - 8],
					],
					{ type: 'Sphere' },
				);
				const path = d3.geoPath(proj);
				const g = svg.append('g');
				const land = topojson.feature(WORLD, WORLD.objects.countries);
				g.append('path')
					.datum(d3.geoGraticule10())
					.attr('d', path)
					.attr('fill', 'none')
					.attr('stroke', 'rgba(255,255,255,.05)');
				g.append('g')
					.selectAll('path')
					.data(land.features)
					.join('path')
					.attr('d', path)
					.attr('fill', d => (d.properties.name === 'Uzbekistan' ? '#2F5A47' : 'var(--land)'))
					.attr('stroke', 'rgba(255,255,255,.09)')
					.attr('stroke-width', 0.5)
					.attr('vector-effect', 'non-scaling-stroke');
				const defs = svg.append('defs');
				const rg = defs.append('radialGradient').attr('id', 'hs' + el.id);
				rg.append('stop').attr('offset', '0%').attr('stop-color', '#D9B25E').attr('stop-opacity', 0.55);
				rg.append('stop').attr('offset', '100%').attr('stop-color', '#D9B25E').attr('stop-opacity', 0);
				const showRisk = !filters || filters.risk;
				const hs = g
					.append('g')
					.attr('pointer-events', 'none')
					.style('display', showRisk ? null : 'none');
				HOTSPOTS.forEach(([lon, lat, r]) => {
					const c = proj([lon, lat]),
						e = proj([lon + r, lat]);
					hs.append('circle')
						.attr('cx', c[0])
						.attr('cy', c[1])
						.attr('r', Math.abs(e[0] - c[0]))
						.attr('fill', `url(#hs${el.id})`);
				});
				let list = TREES;
				if (filters) {
					list = list.filter(
						t =>
							filters.status[t.status === 'planted' ? 'check' : t.status === 'replanted' ? 'alive' : t.status] !==
								false &&
							(!filters.mineOnly || t.mine),
					);
				}
				const dotsG = g.append('g');
				const dots = dotsG
					.selectAll('circle')
					.data(list)
					.join('circle')
					.attr('cx', d => proj([d.lon, d.lat])[0])
					.attr('cy', d => proj([d.lon, d.lat])[1])
					.attr('r', 2.2)
					.attr('fill', d =>
						d.mine ? '#5FD3CF' : d.status === 'alive' || d.status === 'replanted' ? '#7ED281' : '#D9B25E',
					)
					.attr('stroke', d => (d.mine ? '#fff' : 'none'))
					.attr('stroke-width', 0.6)
					.style('cursor', onTree ? 'pointer' : 'default');
				if (onTree)
					dots.on('click', (ev, d) => {
						ev.stopPropagation();
						onTree(d);
					});
				// inactive international regions
				REGIONS.filter(r => !r.active).forEach(r => {
					const p = proj([r.lon, r.lat]);
					g.append('circle')
						.attr('cx', p[0])
						.attr('cy', p[1])
						.attr('r', 4)
						.attr('fill', 'none')
						.attr('stroke', '#9FB6A6')
						.attr('stroke-dasharray', '2 2')
						.attr('vector-effect', 'non-scaling-stroke')
						.attr('pointer-events', onSoon ? 'all' : null) // fill is none; make the whole disc clickable
						.style('cursor', onSoon ? 'pointer' : null)
						.on('click', onSoon ? ev => (ev.stopPropagation(), onSoon(r)) : null);
				});
				if (highlight) {
					const p = proj([highlight.lon, highlight.lat]);
					g.append('circle')
						.attr('cx', p[0])
						.attr('cy', p[1])
						.attr('r', 7)
						.attr('fill', 'none')
						.attr('stroke', '#fff')
						.attr('stroke-width', 1.5)
						.attr('class', 'hl');
				}
				const zoom = d3
					.zoom()
					.scaleExtent([1, 60])
					.on('zoom', ev => {
						g.attr('transform', ev.transform);
						const k = ev.transform.k;
						dots.attr('r', (2.2 + Math.min(k, 30) * 0.1) / k).attr('stroke-width', 0.8 / k);
						g.selectAll('.hl')
							.attr('r', 7 / ev.transform.k)
							.attr('stroke-width', 1.5 / ev.transform.k);
					});
				if (interactive) svg.call(zoom);
				else
					svg
						.call(zoom)
						.on('wheel.zoom', null)
						.on('mousedown.zoom', null)
						.on('touchstart.zoom', null)
						.on('dblclick.zoom', null);
				const api = {
					focus(lon, lat, k, dur = 900) {
						const p = proj([lon, lat]);
						svg
							.transition()
							.duration(dur)
							.call(
								zoom.transform,
								d3.zoomIdentity
									.translate(W / 2, H / 2)
									.scale(k)
									.translate(-p[0], -p[1]),
							);
					},
					zoomBy(f) {
						svg.transition().duration(300).call(zoom.scaleBy, f);
					},
					reset() {
						svg.transition().duration(700).call(zoom.transform, d3.zoomIdentity);
					},
				};
				if (focus) api.focus(focus[0], focus[1], focus[2], focus[3] ?? 0);
				// Intro: one orchestrated timeline — desertification patches bloom first, then tree dots emerge over them.
				if (intro && ANIM && !reducedMotion()) {
					const ease = d3.easeCubicOut,
						clamp = v => Math.max(0, Math.min(1, v)),
						D = 1500;
					hs.style('opacity', 0);
					dotsG.style('opacity', 0);
					const timer = d3.timer(ms => {
						if (!el.isConnected) {
							timer.stop();
							return;
						}
						const p = ms / D;
						hs.style('opacity', ease(clamp(p / 0.55)));
						dotsG.style('opacity', ease(clamp((p - 0.4) / 0.6)));
						if (p >= 1) {
							hs.style('opacity', null);
							dotsG.style('opacity', null);
							timer.stop();
						}
					});
				}
				return api;
			}

			/* ========== nav ========== */
			const ICONS = {

    <div class="cert-foot">
      <div class="cert-qr">${qrSvg.replace(/ (width|height)="[^"]*"/g, '')}</div>
      <div><b>${tr('cert.hash')}</b><div class="hash">${hash}</div><p class="cert-note">${tr('cert.verify')}</p></div>
    </div>
    <p class="cert-note">${tr('cert.note', { date: dateUz(new Date()) })}</p>
  </div>
</article>`;
			}

			/* ----- rating ----- */
			let ratingTab = 'people';
			function pageRating() {
				const groups = {};
				TREES.forEach(t => {
					const k = t.owner;
					groups[k] = groups[k] || {
						name: k,
						type: OWNER_TYPE[k] || (t.mine ? 'people' : 'people'),
						trees: 0,
						alive: 0,
					};
					groups[k].trees++;
					if (t.status === 'alive' || t.status === 'replanted') groups[k].alive++;
					if (OWNER_TYPE[k]) groups[k].type = OWNER_TYPE[k];
				});
				let rows;
				if (ratingTab === 'regions') {
					rows = REGIONS.filter(r => r.active).map(r => {
						const ts = TREES.filter(t => t.region === r.id);
						return {
							name: r.name,
							trees: ts.length,
							alive: ts.filter(t => t.status === 'alive' || t.status === 'replanted').length,
						};
					});
				} else rows = Object.values(groups).filter(g => g.type === ratingTab);
				rows.sort((a, b) => b.trees - a.trees || b.alive - a.alive);
				const tabs = [
					['people', 'Shaxslar'],
					['company', 'Kompaniyalar'],
					['edu', 'Taʼlim muassasalari'],
					['regions', 'Hududlar'],
				];
				$('#app').innerHTML =
					`<div class="page-head"><h2>Reyting</h2><p class="lead">Ekilgan daraxtlar soni va ularning tirik qolish darajasi boʻyicha</p></div>
  <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${ratingTab === k}" data-tab="${k}">${l}</button>`).join('')}</div>
  <div class="table-wrap"><table><thead><tr><th>#</th><th>Nomi</th><th class="num">Daraxtlar</th><th>Tirik qolish</th></tr></thead><tbody>
  ${rows
		.map((x, i) => {
			const p = Math.round((x.alive / x.trees) * 100);
			return `<tr class="${i === 0 ? 'top1' : ''}"><td class="rank">${i + 1}</td><td>${esc(x.name)}</td><td class="num">${x.trees}</td><td><div class="rate-cell"><div class="bar"><i style="width:${p}%"></i></div><span class="small">${p}%</span></div></td></tr>`;
		})
		.join('')}
  </tbody></table></div>
  <p class="note">Tirik qolish ulushi reytingda muhim: koʻp ekib, parvarish qilmaslik yuqori oʻrin bermaydi.</p>`;
				document.querySelectorAll('[data-tab]').forEach(
					b =>
						(b.onclick = () => {
							ratingTab = b.dataset.tab;
							pageRating();
						}),
				);
			}

			/* ----- partner ----- */
			function pagePartner() {
				const pending = ORDERS.filter(o => o.status === 'paid');
				const done = ORDERS.filter(o => o.status === 'planted');
				$('#app').innerHTML =
					`<div class="page-head"><p class="kicker">Hamkor kabineti · demo</p><h2>«Qorakoʻl Yashil» fermer xoʻjaligi</h2></div>
  <div class="kpis"><div class="panel"><b>${pending.reduce((s, o) => s + o.count, 0)}</b><span class="subtle">ekilishi kerak</span></div>
  <div class="panel"><b>${TREES.filter(t => !t.mine && t.region === 'buxoro').length + done.reduce((s, o) => s + o.count, 0)}</b><span class="subtle">jami ekilgan</span></div>
  <div class="panel"><b>${som(TREES.filter(t => t.region === 'buxoro').length * 12000)}</b><span class="subtle">shu mavsum daromadi (demo)</span></div></div>
  <h3 class="section-title">Yangi buyurtmalar</h3>
  ${
		pending.length
			? `<div class="order-list">${pending
					.map(o => {
						const s = speciesOf(o.species),
							r = regionOf(o.region);
						return `<div class="order"><div><h3>${o.count} ta ${s.name.toLowerCase()}</h3><p class="subtle">${r.name} · ${o.id} · ${dateUz(o.created)}</p></div><div class="acts"><button class="btn btn-leaf" data-plant="${o.id}">Ekildi deb belgilash</button></div></div>`;
					})
					.join('')}</div>`
			: `<div class="empty"><h3>Yangi buyurtma yoʻq</h3><p class="muted">Demo uchun avval “Daraxt ekish” boʻlimida buyurtma bering. U shu yerda paydo boʻladi.</p><a class="btn btn-primary" href="#/plant">Buyurtma berish</a></div>`
	}
  <p class="note">Haqiqiy ilovada hamkor faqat oʻz hududidagi buyurtmalarni koʻradi, rasm faqat kameradan olinadi va GPS avtomatik yoziladi.</p>
  <p class="small mt-4"><a href="#/admin">${tr('review.link')} →</a></p>`;
				document.querySelectorAll('[data-plant]').forEach(b => (b.onclick = () => openPlantDialog(b.dataset.plant)));
			}
			function openPlantDialog(oid) {
				const o = ORDERS.find(x => x.id === oid),
					r = regionOf(o.region),
					s = speciesOf(o.species);
				const lat = +(r.lat + (Math.random() - 0.5) * 0.3).toFixed(5),
					lon = +(r.lon + (Math.random() - 0.5) * 0.3).toFixed(5);
				let photo = null;
				$('#dlgIn').innerHTML =
					`<h3>Ekishni tasdiqlash</h3><p class="subtle modal-sub">${o.count} ta ${s.name.toLowerCase()} · ${o.id}</p>
  <div class="gps"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--turq)" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>GPS aniqlandi: <b>${lat}, ${lon}</b><br><span class="subtle">Aniqlik ±4 m (demo)</span></span></div>
  <label class="upload" id="upl"><input type="file" accept="image/*" capture="environment" hidden id="file"><b>Rasm yuklash</b><br><span class="subtle">Ekilgan koʻchat rasmi (ixtiyoriy, demo)</span><div id="prev"></div></label>
  <div class="row"><button class="btn btn-ghost" id="cancel">Bekor qilish</button><button class="btn btn-leaf" id="ok">Ekildi</button></div>`;
				const dlg = $('#dlg');
				dlg.showModal();
				$('#cancel').onclick = () => dlg.close();
				$('#file').onchange = e => {
					const f = e.target.files[0];
					if (!f) return;
					const img = new Image();
					img.onload = () => {
						const c = document.createElement('canvas');
						const k = 320 / Math.max(img.width, img.height);
						c.width = img.width * k;
						c.height = img.height * k;
						c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
						photo = c.toDataURL('image/jpeg', 0.7);
						$('#prev').innerHTML = `<img src="${photo}" alt="Yuklangan rasm">`;
					};
					img.src = URL.createObjectURL(f);
				};
				$('#ok').onclick = async () => {
					const ids = [];
					for (let i = 0; i < Math.min(o.count, 200); i++) {
						const t = {
							id:
								'ECR-UZ-' +
								o.region.slice(0, 2).toUpperCase() +
								'-' +
								String(90000 + MY_TREES.length + 1).padStart(5, '0'),
							species: o.species,
							owner: o.name,
							region: o.region,
							lat: +(lat + (i % 10) * 0.00004).toFixed(5),
							lon: +(lon + Math.floor(i / 10) * 0.00004).toFixed(5),
							planted: new Date().toISOString(),
							status: 'planted',
							dedication: o.message || null,
							mine: true,
							photo: i === 0 ? photo : null,
						};
						MY_TREES.push(t);
						TREES.push(t);
						ids.push(t.id);
					}
					o.status = 'planted';
					o.treeIds = ids;
					store.set('orders', ORDERS);
					store.set('mytrees', MY_TREES);
					dlg.close();
					toast(`${ids.length} ta daraxt ekildi. Egasiga xabar yuborildi.`);
					pagePartner();
				};
			}

			/* ----- verifier: review queue ----- */
			function pageAdmin() {
				const queue = REVIEW.filter(t => t.status === 'needs_review');
				const decided = EVENTS.filter(e => e.from === 'needs_review')
					.slice()
					.reverse();
				const reason = t =>
					t.check === 'mismatch_location'
						? tr('review.why.mismatch_location', { km: numFmt(t.km, 1), lat: t.lat.toFixed(4), lon: t.lon.toFixed(4) })
						: tr('review.why.mismatch_time', {
								taken: dateUz(t.taken),
								uploaded: dateUz(t.uploaded),
								days: Math.round((new Date(t.uploaded) - new Date(t.taken)) / 864e5),
							});
				$('#app').innerHTML =
					`<div class="page-head"><p class="kicker">${tr('review.kicker')}</p><h2>${tr('review.title')}</h2>
  <p class="lead">${tr('review.lead')}</p></div>
  <div class="kpis"><div class="panel"><b>${queue.length}</b><span class="subtle">${tr('review.kpi.queue')}</span></div>
  <div class="panel"><b>${decided.filter(e => e.to === 'alive').length}</b><span class="subtle">${tr('review.kpi.approved')}</span></div>
  <div class="panel"><b>${decided.filter(e => e.to === 'rejected').length}</b><span class="subtle">${tr('review.kpi.rejected')}</span></div></div>
  <h3 class="section-title">${tr('review.queue')} (${queue.length})</h3>
  ${
		queue.length
			? `<div class="order-list">${queue
					.map((t, i) => {
						const s = speciesOf(t.species),
							r = regionOf(t.region);
						return `<div class="review">${saplingSVG(0, t.id.length * 7 + i)}
    <div><h3>${s.name} · <span class="nowrap">${t.id}</span></h3><p class="subtle">${tr('review.meta', { region: r.name, partner: r.partner, date: dateUz(t.uploaded) })}</p>
      <div class="order-status"><span class="pill check"><span class="dot"></span>${tr('review.check.' + t.check)}</span></div>
      <p class="why">${reason(t)}</p></div>
    <div class="acts"><button class="btn btn-leaf" data-approve="${t.id}">${tr('review.approve')}</button><button class="btn btn-ghost" data-reject="${t.id}">${tr('review.reject')}</button></div></div>`;
					})
					.join('')}</div>`
			: `<div class="empty"><h3>${tr('review.empty')}</h3><p class="muted">${tr('review.empty.d')}</p><button class="btn btn-primary" id="resetQueue">${tr('review.reset')}</button></div>`
	}
  ${
		decided.length
			? `<h3 class="section-title">${tr('review.history')}</h3>
  <div class="table-wrap"><table><thead><tr><th>${tr('review.col.tree')}</th><th>${tr('review.col.decision')}</th><th>${tr('review.col.reason')}</th><th>${tr('review.col.time')}</th></tr></thead><tbody>
  ${decided
		.map(
			e =>
				`<tr><td>${e.to === 'alive' ? `<a href="#/tree/${e.tree}">${e.tree}</a>` : e.tree}</td><td>${e.to === 'alive' ? `<span class="pill alive"><span class="dot"></span>${tr('review.pill.approved')}</span>` : `<span class="pill dead"><span class="dot"></span>${tr('review.pill.rejected')}</span>`}</td><td class="small">${esc(e.reason)}</td><td class="subtle">${dateUz(e.at)}, ${new Date(e.at).toTimeString().slice(0, 5)}</td></tr>`,
		)
		.join('')}
  </tbody></table></div>`
			: ''
	}
  <p class="note">${tr('review.note')}</p>`;
				const find = id => REVIEW.find(t => t.id === id);
				document.querySelectorAll('[data-approve]').forEach(
					b =>
						(b.onclick = () => {
							const t = find(b.dataset.approve);
							t.reviewed = transition(
								t,
								'alive',
								tr('review.approve.reason', { check: tr('review.check.' + t.check) }),
							);
							TREES.push(t);
							toast(tr('review.approved'));
							pageAdmin();
						}),
				);
				document.querySelectorAll('[data-reject]').forEach(b => (b.onclick = () => openReject(find(b.dataset.reject))));
				$('#resetQueue') &&
					($('#resetQueue').onclick = () => {
						const ids = new Set(REVIEW_SEED.map(x => x.id));
						EVENTS = EVENTS.filter(e => !ids.has(e.tree));
						store.set('treeEvents', EVENTS);
						TREES = TREES.filter(t => !ids.has(t.id));
						REVIEW = REVIEW_SEED.map(reviewTree);
						toast(tr('review.reset.done'));
						pageAdmin();
					});
			}
			function openReject(t) {
				const dlg =
					openModal(`<h3>${tr('review.reject.title')}</h3><p class="subtle modal-sub">${speciesOf(t.species).name} · ${t.id}</p>
  <div class="field"><label for="rejWhy">${tr('review.reject.label')}</label><select id="rejWhy">${[1, 2, 3, 4].map(i => `<option>${tr('review.reject.r' + i)}</option>`).join('')}</select></div>
  <div class="row"><button class="btn btn-ghost" data-close>${tr('common.close')}</button><button class="btn btn-primary" id="rejOk">${tr('review.reject')}</button></div>`);
				$('#rejOk').onclick = () => {
					transition(t, 'rejected', $('#rejWhy').value);
					dlg.close();
					toast(tr('review.rejected'));
					pageAdmin();
				};
			}

			/* ----- organization dashboard ----- */
			const ORG = { name: 'Kamalak IT', type: 'company' };
			function pageOrg() {
				const list = TREES.filter(t => t.owner === ORG.name).sort((a, b) => b.planted.localeCompare(a.planted));
				const alive = list.filter(t => t.status === 'alive' || t.status === 'replanted').length;
				const co2 = list.reduce((sum, t) => sum + speciesOf(t.species).co2, 0);
				$('#app').innerHTML =
					`<div class="page-head"><p class="kicker">${tr('org.kicker')}</p><h2>${esc(ORG.name)}</h2><p class="lead">${tr('org.lead')}</p></div>
  <div class="kpis"><div class="panel"><b>${list.length}</b><span class="subtle">${tr('org.kpi.trees')}</span></div>
  <div class="panel"><b>${list.length ? Math.round((alive / list.length) * 100) : 0}%</b><span class="subtle">${tr('org.kpi.survival')}</span></div>
  <div class="panel"><b>≈${fmt(co2)} kg</b><span class="subtle">${tr('org.kpi.co2')}</span></div></div>
  <div class="section-head"><h3>${tr('org.trees')}</h3><button class="btn btn-primary" id="report" ${list.length ? '' : 'disabled'}>${tr('org.report')}</button></div>
  ${
		list.length
			? `<div class="table-wrap"><table><thead><tr><th>${tr('org.col.id')}</th><th>${tr('org.col.species')}</th><th>${tr('org.col.region')}</th><th>${tr('org.col.planted')}</th><th>${tr('org.col.status')}</th></tr></thead><tbody>
  ${list.map(t => `<tr><td class="nowrap"><a href="#/tree/${t.id}">${t.id}</a></td><td>${speciesOf(t.species).name}</td><td class="small">${regionOf(t.region).name}</td><td class="small">${dateUz(t.planted)}</td><td>${statusPill(t.status)}</td></tr>`).join('')}
  </tbody></table></div>`
			: `<div class="empty"><h3>${tr('org.empty')}</h3><p>${tr('org.empty.d')}</p><a class="btn btn-primary" href="#/plant">${tr('home.cta.plant')}</a></div>`
	}
  <p class="note">${tr('org.note')}</p>`;
				$('#report').onclick = () => {
					const base = location.href.split('#')[0] + '#/tree/';
					const head = [
						'org.col.id',
						'org.col.species',
						'csv.latin',
						'org.col.region',
						'csv.partner',
						'csv.lat',
						'csv.lon',
						'org.col.planted',
						'org.col.status',
						'csv.co2',
						'csv.url',
					].map(k => tr(k));
					const rows = list.map(t => {
						const s = speciesOf(t.species),
							r = regionOf(t.region);
						return [
							t.id,
							s.name,
							s.latin,
							r.name,
							r.partner,
							t.lat,
							t.lon,
							new Date(t.planted).toLocaleDateString('sv'),
							STATUS_TEXT[t.status] || t.status,
							s.co2,
							base + t.id,
						];
					});
					const cell = v => (/[";\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v));
					// ';' separator + BOM: opens as columns in Excel with uz/ru regional settings
					const csv = '﻿' + [head, ...rows].map(r => r.map(cell).join(';')).join('\r\n');
					const slug = ORG.name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
					download(
						`ecoroots-${slug}-hisobot-${new Date().toLocaleDateString('sv')}.csv`,
						csv,
						'text/csv;charset=utf-8',
					);
					toast(tr('org.report.done'));
				};
			}

			/* ========== router ========== */
			function route() {
				const h = location.hash || '#/';
				const [, p, arg] = h.split('/');
				const active = '#/' + (p || '');
				renderNav(active === '#/tree' ? '' : active);
				const TITLE_KEY = {
					map: 'nav.map',
					plant: 'nav.plant',
					my: 'nav.my',
					rating: 'nav.rating',
					partner: 'nav.partner',
					admin: 'review.title',
					org: 'title.org',
					tree: 'title.tree',
				};
				document.title = TITLE_KEY[p] ? `${tr(TITLE_KEY[p])} · EcoRoots` : `EcoRoots · ${tr('title.home')}`;
				window.scrollTo(0, 0);
				if (p === 'map') pageMap();
				else if (p === 'plant') pagePlant();
				else if (p === 'my') pageMy();
				else if (p === 'rating') pageRating();
				else if (p === 'partner') pagePartner();
				else if (p === 'admin') pageAdmin();
				else if (p === 'org') pageOrg();
				else if (p === 'tree') pagePassport(decodeURIComponent(arg || ''));
				else pageHome();
			}
			window.addEventListener('hashchange', route);
			let rz;
			window.addEventListener('resize', () => {
				clearTimeout(rz);
				rz = setTimeout(() => {
					const p = (location.hash || '#/').split('/')[1];
					if (!p || p === 'map') {
						ANIM = false;
						route();
						ANIM = true;
					}
				}, 250);
			});
			document.querySelectorAll('[data-lang]').forEach(b => (b.onclick = () => setLang(b.dataset.lang)));
			$('#themeBtn').onclick = toggleTheme;
			$('#dlg').addEventListener('close', () => $('#dlg').classList.remove('wide'));
			window.addEventListener('afterprint', () => ($('#printArea').innerHTML = ''));
			applyChrome();
			worldReady.finally(route);
		</script>
	</body>
</html>
